name: Weekly property post

on:
  # 15:00 Friday in Asia/Taipei (07:00 UTC; Taiwan does not observe DST).
  schedule:
    - cron: "0 7 * * 5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-property-post-publisher
  cancel-in-progress: false

jobs:
  publish-weekly-property-post:
    # Keep disabled until the production API and database are verified.
    if: ${{ vars.PROPERTY_POST_SCHEDULER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Call the protected production scheduler
        uses: actions/github-script@v7
        with:
          script: |
            const audience =
              "https://fu-zhu-di-zheng-shi-shi-wu-suo-wang-zhan.replit.app/weekly-property-post-scheduler";
            const token = await core.getIDToken(audience);
            const response = await fetch(
              "https://fu-zhu-di-zheng-shi-shi-wu-suo-wang-zhan.replit.app/api/property-posts/scheduler/run-weekly",
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/json",
                },
                signal: AbortSignal.timeout(1_200_000),
              },
            );
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              core.setFailed(
                `Weekly publisher returned HTTP ${response.status}: ${JSON.stringify(body).slice(0, 800)}`,
              );
              return;
            }
            core.info(
              `Weekly publisher completed: ${body.status ?? "unknown"} (${body.weekKey ?? "unknown week"}).`,
            );
